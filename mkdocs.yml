site_name: BrainO
site_description: EEG analysis engine with validated pipelines, provenance and a local AI agent
site_url: https://kmnuddin.github.io/BrainO_v2/
repo_url: https://github.com/kmnuddin/BrainO_v2
repo_name: kmnuddin/BrainO_v2
edit_uri: edit/main/docs/
copyright: BrainO is free software under the GPL-3.0-or-later licence.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark mode}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light mode}

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Importing recordings: guide/importing.md
      - Analysing EEG: guide/analysis.md
      - Pipelines: guide/pipelines.md
      - Reproducibility: guide/reproducibility.md
      - Validation: guide/validation.md
      - Evaluating the agent: guide/evals.md
  - Examples: examples.md
  - Reference:
      - Tools: reference/tools.md
      - Command line: reference/cli.md
      - Python API: reference/api.md
  - Roadmap: PLAN.md

hooks:
  - docs/hooks.py

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [engine/src]
          options:
            docstring_style: sphinx
            show_root_heading: true
            show_source: false
            members_order: source
            merge_init_into_class: true

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - tables
  - toc:
      permalink: true

exclude_docs: |
  hooks.py
  __pycache__/

name: engine

on:
  push:
    paths: ["engine/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: engine
    env:
      BRAINO_TEST_DATA: ${{ github.workspace }}/.braino-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - name: Cache sample data
        uses: actions/cache@v4
        with:
          path: .braino-test-data
          key: braino-test-data-${{ hashFiles('engine/tests/sample_data.py') }}
      - run: pip install -e ".[dev,eeg]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest --cov=braino --cov-report=term-missing

  # The core engine must keep working without the scientific stack.
  core-only:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: engine/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest

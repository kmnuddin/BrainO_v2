id: erp-p3-one-subject
category: erp
description: Epoch by conditions and measure a difference wave (planted P3 at Pz).
request: >-
  For subject 01, compare the rare and frequent trials at Pz between 300 and 500 ms. How large is
  the difference?
dataset:
  synthetic: {subjects: ["01", "02", "03"], seconds: 60}
checks:
  - {kind: order, before: eeg.preprocess, after: eeg.epoch}
  - kind: tool_called
    tool: eeg.epoch
    args: {conditions: {covers: [stimulus/rare, stimulus/frequent]}}
    description: epochs the rare and the frequent events
  - {kind: tool_called, tool: eeg.erp}
  - {kind: answer_number, min: 3, max: 10, description: the P3 difference, in µV}
solution:
  - {id: pre, tool: eeg.preprocess, args: {subject: "01"}}
  - id: ep
    tool: eeg.epoch
    args:
      subject: "01"
      conditions: {rare: [stimulus/rare], frequent: [stimulus/frequent]}
      reject: peak_to_peak
      peak_to_peak_uv: 100
  - id: erp
    tool: eeg.erp
    args:
      subject: "01"
      contrasts: [{name: difference, plus: rare, minus: frequent}]
      measures: [{name: P3, channels: [Pz], tmin: 0.3, tmax: 0.5}]
answer: >-
  At Pz from 300 to 500 ms, rare trials are {erp.measures[waveform=difference].value_uv:.2f} µV
  more positive than frequent trials (mean amplitude of the difference wave).

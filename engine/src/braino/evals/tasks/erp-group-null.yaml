id: erp-group-null
category: stats
description: >-
  The data have no P3 (none planted): the agent must report that the group effect is not
  significant, not find one.
request: >-
  Across all subjects, is the P3 at Pz (rare minus frequent trials, 300 to 500 ms) significant?
variants:
  - Is there a significant rare-versus-frequent difference at Pz from 300 to 500 ms across the group?
  - Test whether the group shows a P3 at Pz (rare minus frequent, 0.3-0.5 s).
dataset:
  synthetic: {subjects: ["01", "02", "03", "04", "05", "06"], seconds: 60, p3_uv: 0}
checks:
  - {kind: tool_called, tool: [stats.mass_univariate, stats.cluster_permutation]}
  - kind: answer_mentions
    terms: [not significant, no significant, not statistically significant, did not reach,
            no evidence, n.s., none of the, no clusters, 0 significant]
    any_term: true
    description: reports no significant effect
solution:
  - id: pre
    tool: eeg.preprocess
    foreach: ["01", "02", "03", "04", "05", "06"]
    args: {subject: "{subject}"}
  - id: ep
    tool: eeg.epoch
    foreach: ["01", "02", "03", "04", "05", "06"]
    args:
      subject: "{subject}"
      conditions: {rare: [stimulus/rare], frequent: [stimulus/frequent]}
      reject: peak_to_peak
      peak_to_peak_uv: 100
  - id: erp
    tool: eeg.erp
    foreach: ["01", "02", "03", "04", "05", "06"]
    args: {subject: "{subject}", contrasts: [{name: difference, plus: rare, minus: frequent}]}
  - id: stats
    tool: stats.mass_univariate
    args: {task: oddball, conditions: [difference], channels: [Pz], tmin: 0.3, tmax: 0.5}
answer: >-
  No: across {stats.result.n_subjects} subjects the difference at Pz is not significant after
  FDR correction (smallest corrected p {stats.result.min_p:.3f}).

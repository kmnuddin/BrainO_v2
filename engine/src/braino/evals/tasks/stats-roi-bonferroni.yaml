id: stats-roi-bonferroni
category: stats
description: A group test restricted to one channel and window, with the correction asked for.
request: >-
  Test rare against frequent across subjects only at Pz between 300 and 500 ms, with a
  Bonferroni correction.
variants:
  - Group test at Pz, 0.3-0.5 s, rare vs frequent, Bonferroni-corrected.
  - Across the group, compare rare and frequent at Pz from 300 to 500 ms; correct with Bonferroni.
dataset:
  synthetic: {subjects: ["01", "02", "03", "04", "05", "06"], seconds: 60}
checks:
  - kind: tool_called
    tool: stats.mass_univariate
    args: {channels: [Pz], tmin: {range: [0.29, 0.31]}, tmax: {range: [0.49, 0.51]},
           correction: bonferroni}
    description: tests at Pz, 300-500 ms, Bonferroni-corrected
  - {kind: answer_mentions, terms: [Bonferroni]}
solution:
  - id: pre
    tool: eeg.preprocess
    foreach: ["01", "02", "03", "04", "05", "06"]
    args: {subject: "{subject}"}
  - id: ep
    tool: eeg.epoch
    foreach: ["01", "02", "03", "04", "05", "06"]
    args:
      subject: "{subject}"
      conditions: {rare: [stimulus/rare], frequent: [stimulus/frequent]}
      reject: peak_to_peak
      peak_to_peak_uv: 100
  - id: erp
    tool: eeg.erp
    foreach: ["01", "02", "03", "04", "05", "06"]
    args: {subject: "{subject}"}
  - id: stats
    tool: stats.mass_univariate
    args: {task: oddball, conditions: [rare, frequent], channels: [Pz], tmin: 0.3, tmax: 0.5,
           correction: bonferroni}
answer: >-
  At Pz from 300 to 500 ms, {stats.result.n_significant} of {stats.result.n_tests} time points
  differ significantly after Bonferroni correction (peak t = {stats.result.peak_stat:.2f}).

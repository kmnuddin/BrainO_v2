[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "braino"
dynamic = ["version"]
description = "EEG and fMRI analysis engine with a local AI analysis agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kazi Ashraf Moinuddin" }]
keywords = ["EEG", "fMRI", "neuroscience", "BIDS", "MNE", "agent"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
eeg = [
    "curryreader>=0.1",   # Curry reader for MNE
    "mffpy>=0.10",        # EGI MFF reader for MNE
    "mne>=1.13",
    "mne-bids>=0.20",
    "numpy>=2.1",
]
dev = [
    "mypy>=1.10",
    "pooch>=1.8",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
]

[project.scripts]
braino = "braino.cli:app"

[tool.hatch.version]
path = "src/braino/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/braino"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["mne.*", "mne_bids.*", "pooch.*", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: downloads sample data (cached); skipped when BRAINO_SKIP_NETWORK=1",
]

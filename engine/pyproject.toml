[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "braino"
dynamic = ["version"]
description = "EEG and fMRI analysis engine with a local AI analysis agent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Kazi Ashraf Moinuddin" }]
keywords = ["EEG", "fMRI", "neuroscience", "BIDS", "MNE", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "pydantic>=2.6",
    "pyyaml>=6.0",       # pipeline specs
    "typer>=0.12",
]

[project.optional-dependencies]
eeg = [
    "autoreject>=0.4.3",  # epoch rejection and repair
    "curryreader>=0.1",   # Curry reader for MNE
    "mffpy>=0.10",        # EGI MFF reader for MNE
    "mne>=1.13",
    "mne-bids>=0.20",
    "mne-icalabel>=0.7",  # ICLabel component classifier
    "numpy>=2.1",
    "onnxruntime>=1.18",  # runs ICLabel without PyTorch
    "pybv>=0.7",          # BrainVision writer, for BIDS conversion
    "pyprep>=0.4.3",      # PREP noisy-channel detection
    "python-picard>=0.8", # fast extended-infomax ICA
    "scipy>=1.13",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
]
dev = [
    "bids-validator>=1.14",
    "mypy>=1.10",
    "pooch>=1.8",
    "pytest>=8",
    "pytest-cov>=5",
    "types-PyYAML>=6.0",
    "ruff>=0.5",
]

[project.urls]
Homepage = "https://github.com/kmnuddin/BrainO_v2"
Documentation = "https://kmnuddin.github.io/BrainO_v2/"
Source = "https://github.com/kmnuddin/BrainO_v2"
Issues = "https://github.com/kmnuddin/BrainO_v2/issues"
Changelog = "https://github.com/kmnuddin/BrainO_v2/blob/main/CHANGELOG.md"

[project.scripts]
braino = "braino.cli:app"

[tool.hatch.version]
path = "src/braino/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/braino"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = [
    "autoreject.*",
    "mne.*",
    "mne_bids.*",
    "mne_icalabel.*",
    "pooch.*",
    "pyprep.*",
    "scipy.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "network: downloads sample data (cached); skipped when BRAINO_SKIP_NETWORK=1",
    "large_download: downloads over 50 MB (e.g. ERP CORE); runs only when BRAINO_LARGE_DOWNLOADS=1",
]
